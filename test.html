<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>智慧點名系統</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <style>
    body { font-family: 'Noto Sans TC',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background: #f5f7fa;}
    .apple-card { background: #fff; border-radius: 20px; box-shadow: 0 4px 20px rgba(0,0,0,.08); padding: 28px;}
    .apple-btn { border-radius: 12px; font-weight: 600; transition: all 0.18s; border: none; cursor: pointer; }
    .apple-btn-primary { background: #007aff; color: #fff;}
    .apple-btn-primary:hover { background:#0056b3;}
    .apple-btn-danger { background: #ef4444; color: #fff;}
    .apple-btn-danger:hover { background: #b91c1c;}
    .apple-btn-outline { background: #f3f4f6; color: #2563eb; }
    .apple-btn-outline:hover { background: #e0e7ef;}
    .apple-input { background: #f0f0f0; border: none; border-radius: 12px; padding: 13px 16px;}
    .apple-input:focus { outline: 2px solid #007aff;}
    .apple-nav { background: #e5e5ea; border-radius: 14px; display: flex; gap: 12px; padding: 4px; }
    .apple-tab { padding: 10px 22px; border-radius: 10px; font-weight: 500; color: #444; cursor: pointer; }
    .apple-tab.active { background: #fff; color: #007aff; }
    .apple-badge { border-radius: 12px; padding: 2px 13px; font-weight: 600;}
    .apple-status-btn { min-width: 60px; position:relative; }
    .apple-status-btn.active {
      box-shadow: 0 2px 10px #007aff33;
      border: 2.5px solid #007aff;
      font-weight: bold;
      z-index:2;
    }
    .apple-status-present { background: #22c55e; color: #fff;}
    .apple-status-absent { background: #ef4444; color: #fff;}
    .apple-status-late { background: #fbbf24; color: #fff;}
    .apple-status-unknown { background: #e5e7eb; color: #777;}
    .apple-status-btn:not(.active):hover { filter: brightness(1.05); box-shadow:0 2px 12px #007aff18;}
    @media (max-width: 600px) {
      .apple-card {padding:16px;}
      .apple-nav { gap: 1px;}
      .apple-tab {padding:7px 8px;font-size:15px;}
      .apple-status-btn {min-width:48px;font-size:15px;}
    }
  </style>
</head>
<body>
<div id="root"></div>
<script>
const ADMIN_USERNAME = 'easonyichenge';
const ADMIN_PASSWORD = '951019';
const firebaseConfig = {
  apiKey: "AIzaSyAWHcrQdzFIfi8x8MJCLu44Wz5dZOLqQoE",
  authDomain: "test-b5451.firebaseapp.com",
  projectId: "test-b5451",
  storageBucket: "test-b5451.appspot.com",
  messagingSenderId: "740966432025",
  appId: "1:740966432025:web:183468071fcf26c355d988"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getTodayString() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
function firestoreOnStudentsChange(cb) {
  db.collection('attendance').doc('students').onSnapshot(doc => {
    cb(doc.exists ? doc.data().list : []);
  });
}
async function firestoreSaveStudents(students) {
  await db.collection('attendance').doc('students').set({ list: students });
}
function firestoreOnAttendanceRecordsChange(cb) {
  db.collection('attendance').doc('records').onSnapshot(doc => {
    cb(doc.exists ? doc.data() : {});
  });
}
async function firestoreSaveAttendanceRecords(records) {
  await db.collection('attendance').doc('records').set(records);
}

// ======= UI =========
function showLogin() {
  document.getElementById('root').innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-screen">
      <div class="apple-card w-full max-w-sm">
        <h2 class="text-3xl font-bold text-gray-800 mb-6">智慧點名系統</h2>
        <div class="mb-4">
          <input id="input-username" class="apple-input w-full mb-2" placeholder="帳號" autocomplete="username">
          <input id="input-password" class="apple-input w-full" placeholder="密碼" type="password" autocomplete="current-password">
        </div>
        <button id="login-btn" class="apple-btn apple-btn-primary w-full text-lg py-2">登入</button>
        <p id="login-error" class="mt-4 text-red-600 hidden"></p>
      </div>
    </div>
  `;
  document.getElementById("login-btn").onclick = function() {
    const username = document.getElementById("input-username").value.trim();
    const password = document.getElementById("input-password").value;
    if (username === ADMIN_USERNAME && password === ADMIN_PASSWORD) {
      localStorage.setItem('isAdmin', 'yes');
      showTeacherView(username); runTeacherApp();
    } else {
      document.getElementById('login-error').textContent = '帳號或密碼錯誤';
      document.getElementById('login-error').classList.remove('hidden');
    }
  };
}

function showTeacherView(username) {
  document.getElementById('root').innerHTML = `
    <div id="teacher-view">
      <div class="container mx-auto pt-6 pb-2 px-2 max-w-3xl">
        <header class="flex flex-wrap items-center justify-between mb-7 gap-2">
          <div class="flex-1 text-gray-800 font-bold text-2xl tracking-tight">智慧點名系統</div>
          <div class="flex items-center gap-2">
            <span class="text-xs text-gray-600 bg-blue-100 px-2 py-1 rounded-md">${username}</span>
            <button id="logout-btn" class="apple-btn bg-gray-100 text-gray-600 hover:bg-gray-200 px-3 py-1">登出</button>
          </div>
        </header>
        <nav class="apple-nav mb-7">
          <a id="tab-roll-call" class="apple-tab active">今日點名</a>
          <a id="tab-roster" class="apple-tab">學生名冊</a>
          <a id="tab-history" class="apple-tab">歷史紀錄</a>
          <a id="tab-qr" class="apple-tab">產生簽到 QR Code</a>
        </nav>
        <main>
          <div id="page-roll-call">
            <div class="apple-card">
              <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-5 gap-4">
                <div>
                  <h2 class="text-xl font-bold text-gray-800">今日點名</h2>
                  <p class="text-gray-500">點擊狀態按鈕或學生簽到後，狀態會自動同步</p>
                </div>
                <div class="flex flex-col items-end gap-1 min-w-[80px]">
                  <span class="apple-badge text-green-700 bg-green-100">到課: <span id="present-count">0</span></span>
                  <span class="apple-badge text-red-700 bg-red-100">未到: <span id="absent-count">0</span></span>
                  <span class="apple-badge text-yellow-700 bg-yellow-100">遲到: <span id="late-count">0</span></span>
                </div>
              </div>
              <div id="roll-call-list" class="space-y-3 max-h-[48vh] overflow-y-auto pr-2"></div>
            </div>
          </div>
          <div id="page-roster" class="hidden">
            <div class="apple-card">
              <h2 class="text-xl font-bold text-gray-800 mb-4">學生名冊管理</h2>
              <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <input type="text" id="new-student-id" placeholder="學號" class="apple-input w-1/3">
                <input type="text" id="new-student-name" placeholder="姓名" class="flex-grow apple-input w-2/3">
                <button id="add-student-btn" class="apple-btn apple-btn-primary w-full sm:w-auto">新增</button>
              </div>
              <div id="roster-list" class="space-y-2 max-h-[48vh] overflow-y-auto pr-2"></div>
            </div>
          </div>
          <div id="page-history" class="hidden">
            <div class="apple-card">
              <h2 class="text-xl font-bold text-gray-800 mb-4">歷史點名紀錄</h2>
              <div id="history-list" class="space-y-2 max-h-[48vh] overflow-y-auto pr-2"></div>
            </div>
          </div>
          <div id="page-qr" class="hidden">
            <div class="apple-card text-center">
              <h2 class="text-xl font-bold text-gray-800 mb-4">產生今日簽到 QR Code</h2>
              <div class="mb-4 flex flex-col items-center gap-3">
                <canvas id="today-qr-canvas" class="bg-white rounded-lg shadow-lg"></canvas>
                <button id="download-qr-btn" class="apple-btn apple-btn-primary mt-1">下載 QRCode</button>
              </div>
              <div class="mb-3 text-sm text-gray-700 break-words">
                學生可掃描或直接點擊簽到<br>
                <a href="${location.origin + location.pathname}?mode=student" class="text-blue-600 underline" target="_blank">${location.origin + location.pathname}?mode=student</a>
                <button id="copy-link-btn" class="apple-btn apple-btn-outline ml-2 px-3 py-1 text-xs">複製連結</button>
              </div>
              <p class="text-xs text-gray-500">每人一天僅能簽到一次，請勿重複</p>
            </div>
          </div>
        </main>
      </div>
    </div>
  `;
}

function runTeacherApp() {
  const tabIds = ["roll-call", "roster", "history", "qr"];
  const tabs = Object.fromEntries(tabIds.map(id=>[id, document.getElementById('tab-' + id)]));
  const pages = Object.fromEntries(tabIds.map(id=>[id, document.getElementById('page-' + id)]));
  // 今日點名 DOM
  const rollCallList = document.getElementById('roll-call-list');
  const presentCountEl = document.getElementById('present-count');
  const absentCountEl = document.getElementById('absent-count');
  const lateCountEl = document.getElementById('late-count');
  // 學生名單 DOM
  const rosterList = document.getElementById('roster-list');
  const newStudentIdInput = document.getElementById('new-student-id');
  const newStudentNameInput = document.getElementById('new-student-name');
  const addStudentBtn = document.getElementById('add-student-btn');
  // 歷史紀錄
  const historyList = document.getElementById('history-list');
  // QRCode
  const todayQrCanvas = document.getElementById('today-qr-canvas');
  const downloadQrBtn = document.getElementById('download-qr-btn');
  const copyLinkBtn = document.getElementById('copy-link-btn');
  // 其它
  const todayString = getTodayString();
  let students = [];
  let attendanceRecords = {};

  firestoreOnStudentsChange(list => {
    students = list;
    renderRosterList();
    renderRollCallList();
  });
  firestoreOnAttendanceRecordsChange(records => {
    attendanceRecords = records;
    if (!attendanceRecords[todayString]) attendanceRecords[todayString] = {};
    renderRollCallList();
    renderHistory();
  });

  // Tab 切換
  Object.values(tabs).forEach(tab => {
    tab.onclick = () => {
      Object.values(tabs).forEach(t=>t.classList.remove("active"));
      Object.values(pages).forEach(p=>p.classList.add("hidden"));
      tab.classList.add("active");
      const pid = "page-" + tab.id.slice(4);
      document.getElementById(pid).classList.remove("hidden");
    }
  });

  // 今日點名
  function renderRollCallList() {
    rollCallList.innerHTML = '';
    if (students.length === 0) {
      rollCallList.innerHTML = `<p class="text-gray-500 text-center py-4">尚無學生，請先新增。</p>`;
      updateCounts(); return;
    }
    let present=0, absent=0, late=0;
    students.forEach(s => {
      const status = attendanceRecords[todayString]?.[s.id] || 'unknown';
      if(status==='present') present++;
      if(status==='absent') absent++;
      if(status==='late') late++;
      const btns = renderStatusBtns(s.id, status);
      const item = document.createElement('div');
      item.className = `flex items-center justify-between p-4 bg-gray-50 rounded-xl`;
      item.innerHTML = `
        <div>
          <p class="font-semibold text-lg">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
        </div>
        <div class="flex gap-2">${btns}</div>
      `;
      rollCallList.appendChild(item);
    });
    presentCountEl.textContent = present;
    absentCountEl.textContent = absent;
    lateCountEl.textContent = late;
  }
  function renderStatusBtns(id, status) {
    // 狀態順序與樣式
    const statusArr = [
      {key:'present', text:'到課', cls:'apple-status-present'},
      {key:'absent', text:'缺席', cls:'apple-status-absent'},
      {key:'late', text:'遲到', cls:'apple-status-late'},
      {key:'unknown', text:'--', cls:'apple-status-unknown'}
    ];
    return statusArr.map(st=>{
      const isActive = status===st.key;
      // 狀態按鈕「active」有顯著邊框，無勾勾icon
      return `<button data-id="${id}" data-status="${st.key}" 
        class="apple-btn apple-status-btn ${st.cls} ${isActive?'active':''}">
        <span style="opacity:${isActive?'1':'0.82'}">${st.text}</span>
      </button>`;
    }).join('');
  }
  rollCallList.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-status]');
    if (btn) {
      const id = btn.dataset.id, status = btn.dataset.status;
      if (!attendanceRecords[todayString]) attendanceRecords[todayString] = {};
      if (status === 'unknown') {
        delete attendanceRecords[todayString][id];
      } else {
        attendanceRecords[todayString][id] = status;
      }
      await firestoreSaveAttendanceRecords(attendanceRecords);
    }
  });

  // 學生名單
  function renderRosterList() {
    rosterList.innerHTML = '';
    if (students.length === 0) {
      rosterList.innerHTML = `<p class="text-gray-500 text-center py-4">目前沒有學生。</p>`; return;
    }
    students.forEach(s => {
      const item = document.createElement('div');
      item.className = 'flex items-center justify-between p-4 bg-gray-50 rounded-xl';
      item.innerHTML = `<div>
        <p class="font-semibold">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
      </div>
      <div>
        <button data-id="${s.id}" class="apple-btn apple-btn-danger text-xs px-3 py-1">刪除</button>
      </div>`;
      rosterList.appendChild(item);
    });
  }
  rosterList.addEventListener('click', async (e) => {
    const btn = e.target.closest('.apple-btn-danger');
    if (btn) {
      const studentId = btn.dataset.id;
      students = students.filter(s => s.id !== studentId);
      await firestoreSaveStudents(students);
    }
  });
  addStudentBtn.onclick = async () => {
    const id = newStudentIdInput.value.trim();
    const name = newStudentNameInput.value.trim();
    if (id && name) {
      if (students.some(s => s.id === id)) {
        alert("已有相同學號的學生！");
        return;
      }
      students.push({ id, name });
      newStudentIdInput.value = '';
      newStudentNameInput.value = '';
      await firestoreSaveStudents(students);
    }
  };

  // 歷史紀錄
  function renderHistory() {
    historyList.innerHTML = '';
    const dates = Object.keys(attendanceRecords).sort();
    if (dates.length === 0) {
      historyList.innerHTML = `<p class="text-gray-500 text-center py-4">尚無紀錄。</p>`;
      return;
    }
    dates.forEach(date => {
      const rec = attendanceRecords[date] || {};
      const line = document.createElement('div');
      line.className = "p-2 bg-gray-100 rounded mb-2";
      line.innerHTML = `<div class="font-bold mb-1">${date}</div>` + students.map(s => {
        let txt = '--', color = 'text-gray-400';
        if(rec[s.id]==='present') txt='到課', color='text-green-600';
        if(rec[s.id]==='absent') txt='缺席', color='text-red-600';
        if(rec[s.id]==='late') txt='遲到', color='text-yellow-600';
        return `<span class="inline-block mr-2">${s.name}(${s.id}): <span class="${color}">${txt}</span></span>`;
      }).join('');
      historyList.appendChild(line);
    });
  }

  // QR Code
  QRCode.toCanvas(todayQrCanvas, `${location.origin + location.pathname}?mode=student`, { width: 220, margin: 1 });
  downloadQrBtn.onclick = function() {
    const url = todayQrCanvas.toDataURL();
    const a = document.createElement('a');
    a.href = url;
    a.download = `簽到QRCode.png`;
    a.click();
  };
  copyLinkBtn.onclick = function() {
    navigator.clipboard.writeText(`${location.origin + location.pathname}?mode=student`);
    copyLinkBtn.textContent = "已複製";
    setTimeout(()=>{copyLinkBtn.textContent="複製連結"},1200);
  }
}

// ======= 學生簽到頁 (mode=student) =======
function showStudentSignPage() {
  document.body.innerHTML = `
  <div class="flex flex-col items-center justify-center min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-100">
    <div class="apple-card max-w-sm w-full text-center">
      <h2 class="text-2xl font-bold mb-4 text-gray-800">簽到登記</h2>
      <input id="student-id" class="apple-input w-full mb-3" placeholder="請輸入學號">
      <button id="sign-btn" class="apple-btn apple-btn-primary w-full py-3 text-lg">簽到</button>
      <p id="sign-msg" class="mt-4 text-green-700 text-lg hidden"></p>
      <p class="mt-3 text-gray-500 text-sm">請輸入正確學號<br>同一天僅能簽到一次</p>
    </div>
  </div>
  `;
  document.getElementById("sign-btn").onclick = async function() {
    const btn = document.getElementById("sign-btn");
    const idInput = document.getElementById("student-id");
    const id = idInput.value.trim();
    if (!id) { alert("請輸入學號"); return; }
    const today = getTodayString();
    // 先檢查學生名冊是否有這個學號
    const stuDoc = await db.collection('attendance').doc('students').get();
    const students = stuDoc.exists ? stuDoc.data().list : [];
    const found = students.find(s => s.id === id);
    if (!found) { alert("查無此學號，請確認！"); return; }
    // 取得出席資料
    const recDoc = await db.collection('attendance').doc('records').get();
    const records = recDoc.exists ? recDoc.data() : {};
    if (!records[today]) records[today] = {};
    if (records[today][id] === 'present') {
      document.getElementById('sign-msg').textContent = "你今天已經簽到過囉！";
      document.getElementById('sign-msg').classList.remove('hidden');
      btn.textContent = "已完成";
      btn.classList.add("bg-green-400","text-white");
      btn.disabled = true;
      idInput.disabled = true;
      return;
    }
    records[today][id] = 'present';
    await db.collection('attendance').doc('records').set(records);
    document.getElementById('sign-msg').textContent = "簽到成功！";
    document.getElementById('sign-msg').classList.remove('hidden');
    btn.textContent = "已完成";
    btn.classList.add("bg-green-400","text-white");
    btn.disabled = true;
    idInput.disabled = true;
  };
}

// ========== 登入流程 ==========
window.onload = function() {
  if (new URLSearchParams(window.location.search).get("mode") === "student") {
    showStudentSignPage();
    return;
  }
  if (localStorage.getItem('isAdmin') === 'yes') {
    showTeacherView(ADMIN_USERNAME);
    runTeacherApp();
  } else {
    showLogin();
  }
};
document.addEventListener("click", function(e){
  if(e.target && e.target.id === "logout-btn") {
    localStorage.removeItem('isAdmin');
    location.reload();
  }
});
</script>
</body>
</html>
