const db = firebase.firestore();
function getTodayString() {
    const now = new Date();
    return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}
function firestoreOnStudentsChange(cb) {
    db.collection('attendance').doc('students').onSnapshot(doc => {
        cb(doc.exists ? doc.data().list : []);
    });
}
async function firestoreSaveStudents(students) {
    await db.collection('attendance').doc('students').set({ list: students });
}
function firestoreOnAttendanceRecordsChange(cb) {
    db.collection('attendance').doc('records').onSnapshot(doc => {
        cb(doc.exists ? doc.data() : {});
    });
}
async function firestoreSaveAttendanceRecords(records) {
    await db.collection('attendance').doc('records').set(records);
}

`;
    const todayString = getTodayString();
    const inputMyid = document.getElementById('input-myid');
    const genMyqrcodeBtn = document.getElementById('gen-myqrcode-btn');

    genMyqrcodeBtn.onclick = function() {
        const myid = inputMyid.value.trim();
        if(!myid) { alert("請輸入學號！"); return; }

        QRCode.toCanvas(document.getElementById('myqrcode-canvas'), content, { width: 180, margin: 1 });

function runTeacherApp() {
    const teacherView = document.getElementById('teacher-view');
    const currentDateEl = document.getElementById('current-date');
    const tabContainer = document.getElementById('tab-container');
    const tabs = {
        rollCall: document.getElementById('tab-roll-call'),
        roster: document.getElementById('tab-roster'),
        history: document.getElementById('tab-history'),
    };
    const pages = {
        rollCall: document.getElementById('page-roll-call'),
        roster: document.getElementById('page-roster'),
        history: document.getElementById('page-history'),
    };
    const rollCallList = document.getElementById('roll-call-list');
    const presentCountEl = document.getElementById('present-count');
    const absentCountEl = document.getElementById('absent-count');
    const lateCountEl = document.getElementById('late-count');
    const rosterList = document.getElementById('roster-list');
    const newStudentIdInput = document.getElementById('new-student-id');
    const newStudentNameInput = document.getElementById('new-student-name');
    const addStudentBtn = document.getElementById('add-student-btn');
    const publicQrBtn = document.getElementById('public-qr-btn');
    const historyDateInput = document.getElementById('history-date-input');
    const historyPrevBtn = document.getElementById('history-prev-btn');
    const historyNextBtn = document.getElementById('history-next-btn');
    const historyTodayBtn = document.getElementById('history-today-btn');
    const historyList = document.getElementById('history-list');
    const scanQrBtn = document.getElementById('scan-qr-btn');
    let students = [];
    let attendanceRecords = {};
    const todayString = getTodayString();
    let historyDates = [];
    let selectedHistoryDate = "";
    firestoreOnStudentsChange(list => {
        students = list;
        renderRosterList();
        renderRollCallList();
    });
    firestoreOnAttendanceRecordsChange(records => {
        attendanceRecords = records;
        if (!attendanceRecords[todayString]) attendanceRecords[todayString] = {};
        renderRollCallList();
        renderHistory();
    });
    function renderRollCallList() {
        rollCallList.innerHTML = '';
        if (students.length === 0) {
            rollCallList.innerHTML = `<p class="text-gray-500 text-center py-4">請先到「學生名冊」新增學生。</p>`;
            updateCounts(); return;
        }
        students.forEach(s => {
            const status = attendanceRecords[todayString]?.[s.id] || 'unknown';
            const item = document.createElement('div');
            item.className = `flex items-center justify-between p-4 bg-gray-50 rounded-xl transition hover:bg-gray-100`;
            item.innerHTML = `
                <div>
                    <p class="font-semibold text-lg">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
                </div>
                <div class="flex space-x-2">
                    <button data-id="${s.id}" data-status="present" class="px-3 py-1 text-sm rounded-full ${status === 'present' ? 'bg-green-500 text-white' : 'bg-gray-200'}">到課</button>
                    <button data-id="${s.id}" data-status="absent" class="px-3 py-1 text-sm rounded-full ${status === 'absent' ? 'bg-red-500 text-white' : 'bg-gray-200'}">缺席</button>
                    <button data-id="${s.id}" data-status="late" class="px-3 py-1 text-sm rounded-full ${status === 'late' ? 'bg-yellow-500 text-white' : 'bg-gray-200'}">遲到</button>
                    <button data-id="${s.id}" class="show-today-qr-btn apple-btn bg-gray-200 text-gray-800 px-2 py-1 text-xs"><ion-icon name="qr-code-outline"></ion-icon>今日QR</button>
                </div>
            `;
            rollCallList.appendChild(item);
        });
        updateCounts();
    }
    function updateCounts() {
        const records = Object.values(attendanceRecords[todayString] || {});
        presentCountEl.textContent = records.filter(s => s === 'present').length;
        absentCountEl.textContent = records.filter(s => s === 'absent').length;
        lateCountEl.textContent = records.filter(s => s === 'late').length;
    }
    function renderRosterList() {
        rosterList.innerHTML = '';
        if (students.length === 0) {
            rosterList.innerHTML = `<p class="text-gray-500 text-center py-4">目前沒有學生。</p>`; return;
        }
        students.forEach(s => {
            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-4 bg-gray-50 rounded-xl';
            item.innerHTML = `<div>
                <p class="font-semibold">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
            </div>
            <div class="flex items-center gap-2">
                <button class="show-today-qr-btn apple-btn bg-gray-300 px-3 py-1 text-sm" data-id="${s.id}" data-name="${s.name}"><ion-icon name="qr-code-outline"></ion-icon> 今日 QR</button>
                <button data-id="${s.id}" class="delete-student-btn text-red-500 hover:text-red-700"><ion-icon name="trash-outline" class="text-xl"></ion-icon></button>
            </div>`;
            rosterList.appendChild(item);
        });
    }
    function renderHistory() {
        historyDates = Object.keys(attendanceRecords).sort((a, b) => new Date(a) - new Date(b));
        if (historyDates.length === 0) {
            historyDateInput.value = "";
            renderHistoryForDate("");
            if (window.historyDatePicker) window.historyDatePicker.set('enable', []);
            return;
        }
        selectedHistoryDate = selectedHistoryDate && historyDates.includes(selectedHistoryDate) ? selectedHistoryDate : historyDates[historyDates.length-1];
        historyDateInput.value = selectedHistoryDate;
        renderHistoryForDate(selectedHistoryDate);
        if (window.historyDatePicker) window.historyDatePicker.set('enable', historyDates);
    }
    function renderHistoryForDate(date) {
        historyList.innerHTML = '';
        if (!date || !attendanceRecords[date]) {
            historyList.innerHTML = `<p class="text-gray-500 text-center py-4">此日期無紀錄。</p>`;
            return;
        }
        const records = attendanceRecords[date] || {};
        const studentIds = Object.keys(records);
        if (studentIds.length === 0) {
            historyList.innerHTML = `<p class="text-gray-500 text-center py-4">此日期無紀錄。</p>`; return;
        }
        students.filter(s => studentIds.includes(s.id)).forEach(s => {
            const status = records[s.id];
            const item = document.createElement('div');
            item.className = 'flex items-center justify-between p-4 bg-gray-50 rounded-xl';
            item.innerHTML = `
                <div>
                    <p class="font-semibold">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
                </div>
                <div class="flex space-x-2">
                    <button data-id="${s.id}" data-status="present" data-date="${date}" class="history-status-btn px-3 py-1 text-sm rounded-full ${status === 'present' ? 'bg-green-500 text-white' : 'bg-gray-200'}">到課</button>
                    <button data-id="${s.id}" data-status="absent" data-date="${date}" class="history-status-btn px-3 py-1 text-sm rounded-full ${status === 'absent' ? 'bg-red-500 text-white' : 'bg-gray-200'}">缺席</button>
                    <button data-id="${s.id}" data-status="late" data-date="${date}" class="history-status-btn px-3 py-1 text-sm rounded-full ${status === 'late' ? 'bg-yellow-500 text-white' : 'bg-gray-200'}">遲到</button>
                </div>
            `;
            historyList.appendChild(item);
        });
    }
    window.historyDatePicker = flatpickr(historyDateInput, {
        dateFormat: "Y-m-d",
        disableMobile: true,
        enable: [],
        allowInput: false,
        clickOpens: true,
        onOpen: function(selectedDates, dateStr, instance){
            setTimeout(()=>{
                if(instance.selectedDateElem) instance.selectedDateElem.focus();
            },10);
        },
        onChange: function(selectedDates, dateStr) {
            if (dateStr && historyDates.includes(dateStr)) {
                selectedHistoryDate = dateStr;
                renderHistoryForDate(dateStr);
            }
        }
    });
    historyPrevBtn.addEventListener('click', function(){
        if (!selectedHistoryDate || historyDates.length === 0) return;
        let idx = historyDates.indexOf(selectedHistoryDate);
        if (idx > 0) {
            selectedHistoryDate = historyDates[idx-1];
            historyDateInput.value = selectedHistoryDate;
            renderHistoryForDate(selectedHistoryDate);
        }
    });
    historyNextBtn.addEventListener('click', function(){
        if (!selectedHistoryDate || historyDates.length === 0) return;
        let idx = historyDates.indexOf(selectedHistoryDate);
        if (idx < historyDates.length-1) {
            selectedHistoryDate = historyDates[idx+1];
            historyDateInput.value = selectedHistoryDate;
            renderHistoryForDate(selectedHistoryDate);
        }
    });
    historyTodayBtn.addEventListener('click', function() {
        if (historyDates.length === 0) return;
        let todayStr = getTodayString();
        if (!historyDates.includes(todayStr)) todayStr = historyDates[historyDates.length-1];
        selectedHistoryDate = todayStr;
        historyDateInput.value = todayStr;
        renderHistoryForDate(todayStr);
    });
    historyList.addEventListener('click', async function(e){
        const btn = e.target.closest('.history-status-btn');
        if (btn) {
            const date = btn.getAttribute('data-date');
            const id = btn.getAttribute('data-id');
            const status = btn.getAttribute('data-status');
            if (!attendanceRecords[date]) attendanceRecords[date] = {};
            attendanceRecords[date][id] = status;
            await firestoreSaveAttendanceRecords(attendanceRecords);
        }
    });
    rollCallList.addEventListener('click', async (e) => {
        const btn = e.target.closest('button[data-status]');
        if (btn) {
            attendanceRecords[todayString][btn.dataset.id] = btn.dataset.status;
            await firestoreSaveAttendanceRecords(attendanceRecords);
        }
        const qrBtn = e.target.closest('.show-today-qr-btn');
        if (qrBtn) showStudentTodayQr(qrBtn.dataset.id);
    });
    rosterList.addEventListener('click', async (e) => {
        const btn = e.target.closest('.delete-student-btn');
        if (btn) {
            const studentId = btn.dataset.id;
            const student = students.find(s => s.id === studentId);
            showConfirm(`確定要刪除「${student.name}」嗎？`, async () => {
                students = students.filter(s => s.id !== studentId);
                Object.keys(attendanceRecords).forEach(date => delete attendanceRecords[date][studentId]);
                await firestoreSaveStudents(students);
                await firestoreSaveAttendanceRecords(attendanceRecords);
            });
        }
        const qrBtn = e.target.closest('.show-today-qr-btn');
        if (qrBtn) showStudentTodayQr(qrBtn.dataset.id);
    });
    addStudentBtn.addEventListener('click', async () => {
        const id = newStudentIdInput.value.trim();
        const name = newStudentNameInput.value.trim();
        if (id && name) {
            if (students.some(s => s.id === id)) {
                alert("已有相同學號的學生！");
                return;
            }
            students.push({ id, name });
            newStudentIdInput.value = '';
            newStudentNameInput.value = '';
            await firestoreSaveStudents(students);
        }
    });
    publicQrBtn.addEventListener('click', function() {
        const modalEl = document.createElement('div');
        modalEl.className = "w-full max-w-xs text-center";
        modalEl.innerHTML = `
            <div class="flex justify-between items-center pb-3">
                <h3 class="text-lg font-semibold">全班共用學生 QR Code</h3>
                <button class="modal-close-btn text-gray-400 hover:text-gray-600"><ion-icon name="close-outline" class="text-2xl"></ion-icon></button>
            </div>
            <div class="bg-white p-4 rounded-lg inline-block">
                <canvas id="public-qr-canvas"></canvas>
            </div>
            <p class="mt-4 text-gray-600">學生掃描此 QR Code 進入輸入學號產生個人今日 QR Code 頁面</p>
            <p class="mt-2 text-xs text-gray-500 break-all">${location.origin + location.pathname}?mode=studentqrcode</p>
        `;
        openModal(modalEl);
        const url = `${location.origin + location.pathname}?mode=studentqrcode`;
        QRCode.toCanvas(document.getElementById('public-qr-canvas'), url, { width: 256, margin: 1 });
    });
    scanQrBtn.addEventListener('click', () => {
        const modalEl = document.createElement('div');
        modalEl.className = "w-full max-w-xs";
        modalEl.innerHTML = `
            <div class="flex justify-between items-center pb-3">
                <h3 class="text-lg font-semibold">掃描學生 QR Code</h3>
                <button class="modal-close-btn text-gray-400 hover:text-gray-600"><ion-icon name="close-outline" class="text-2xl"></ion-icon></button>
            </div>
            <div id="qr-reader" style="width: 280px;" class="mx-auto"></div>
            <p id="qr-status-msg" class="mt-3 text-center text-sm text-gray-700"></p>
        `;
        let html5Qr;
        const closeModal = openModal(modalEl, { onClose: ()=>{ if(html5Qr) html5Qr.stop(); } });
        const qrStatusMsg = modalEl.querySelector('#qr-status-msg');
        html5Qr = new Html5Qrcode("qr-reader");
        html5Qr.start(
            { facingMode: "environment" },
            { fps: 10, qrbox: 200 },
            code => {
                let [id, date] = String(code).trim().split('|');
                if (!id || !date) {
                    qrStatusMsg.textContent = "QR Code 格式錯誤！";
                    return;
                }
                id = id.trim();
                date = date.trim();
                if (date !== todayString) {
                    qrStatusMsg.textContent = `此 QR Code 僅限 ${todayString} 使用！`;
                    return;
                }
                const stu = students.find(s => s.id.trim() === id);
                if (!stu) {
                    qrStatusMsg.textContent = "無法辨識此學號，請確認 QR Code 是否正確。";
                    return;
                }
                attendanceRecords[todayString][stu.id] = 'present';
                firestoreSaveAttendanceRecords(attendanceRecords);
                qrStatusMsg.textContent = `✅ 已成功點名：${stu.name} (${stu.id})`;
                setTimeout(() => { closeModal(); }, 1200);
                html5Qr.stop();
            },
            err => {}
        ).catch(e=>{qrStatusMsg.textContent="無法啟動相機："+e;});
    });
    function openModal(modalEl, options = {}) {
        let modalContainer = document.getElementById('modal-container');
        if (!modalContainer) {
            modalContainer = document.createElement('div');
            modalContainer.id = 'modal-container';
            document.body.appendChild(modalContainer);
        }
        modalContainer.innerHTML = '';
        const backdrop = document.createElement('div');
        backdrop.className = 'modal-backdrop fixed inset-0';
        modalContainer.appendChild(backdrop);
        const card = document.createElement('div');
        card.className = 'apple-card relative';
        card.appendChild(modalEl);
        modalContainer.appendChild(card);
        modalEl.classList.remove('hidden');
        modalContainer.classList.remove('hidden');
        modalContainer.classList.add('flex', 'items-center', 'justify-center', 'p-4');
        const closeModal = () => {
            modalContainer.innerHTML = '';
            modalContainer.classList.add('hidden');
            modalContainer.classList.remove('flex', 'items-center', 'justify-center', 'p-4');
            if(options.onClose) options.onClose();
        };
        backdrop.addEventListener('click', closeModal);
        modalContainer.querySelectorAll('.modal-close-btn').forEach(btn => btn.addEventListener('click', closeModal));
        return closeModal;
    }
    function showConfirm(title, onOk) {
        const modalEl = document.createElement('div');
        modalEl.className = "w-full max-w-sm";
        modalEl.innerHTML = `
            <h3 class="text-lg font-semibold text-center mb-4">${title}</h3>
            <div class="flex justify-center gap-3">
                <button id="confirm-btn-cancel" class="w-full apple-btn bg-gray-200 text-gray-800 py-2">取消</button>
                <button id="confirm-btn-ok" class="w-full apple-btn apple-btn-primary py-2">確定</button>
            </div>
        `;
        const close = openModal(modalEl);
        modalEl.querySelector('#confirm-btn-ok').addEventListener('click', () => { onOk(); close(); });
        modalEl.querySelector('#confirm-btn-cancel').addEventListener('click', close);
    }
    function showStudentTodayQr(studentId) {
        const student = students.find(s => s.id === studentId);
        if (!student) return;
        const modalEl = document.createElement('div');
        modalEl.className = "w-full max-w-xs text-center";
        modalEl.innerHTML = `
            <div class="flex justify-between items-center pb-3">
                <h3 class="text-lg font-semibold">學生今日 QR Code</h3>
                <button class="modal-close-btn text-gray-400 hover:text-gray-600"><ion-icon name="close-outline" class="text-2xl"></ion-icon></button>
            </div>
            <div class="bg-white p-4 rounded-lg inline-block">
                <canvas id="student-qr-canvas"></canvas>
            </div>
            <p class="mt-2"><b>${student.name} (${student.id})</b></p>
            <p class="mt-2 text-xs text-gray-500">內容：${student.id}|${todayString}</p>
            <button id="download-qr-btn" class="apple-btn apple-btn-primary px-4 py-2 mt-3">下載 QR Code</button>
        `;
        openModal(modalEl);
        QRCode.toCanvas(document.getElementById('student-qr-canvas'), `${student.id}|${todayString}`, { width: 180, margin: 1 });
        modalEl.querySelector('#download-qr-btn').addEventListener('click', () => {
            const canvas = document.getElementById('student-qr-canvas');
            const link = document.createElement('a');
            link.download = `${student.name}_${student.id}_QRCode.png`;
            link.href = canvas.toDataURL();
            link.click();
        });
    }
    currentDateEl.textContent = `${todayString.replace(/-/g, " 年 ").replace(/$/, " 日").replace(/-(\d+) 年 /, " 月 ")}`;
    tabContainer.addEventListener('click', (e) => {
        if(e.target.classList.contains('apple-tab-link')) {
            Object.values(tabs).forEach(t => t.classList.remove('active'));
            Object.values(pages).forEach(p => p.classList.add('hidden'));
            e.target.classList.add('active');
            const pageId = 'page-' + e.target.id.split('-').slice(1).join('-');
            const pageElement = document.getElementById(pageId);
            if (pageElement) {
                pageElement.classList.remove('hidden');
            }
            if(pageId === 'page-history') renderHistory();
        }
    });
}
</script>
</body>
</html>
