<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>智慧點名系統（老師專用）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Tailwind CDN 僅供測試教學用，正式上線建議自行打包 -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.4.4/build/qrcode.min.js"></script>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif; background: #f5f7fa;}
    .apple-card { background: #fff; border-radius: 18px; box-shadow: 0 4px 24px 0 rgba(0,0,0,.07); padding: 24px;}
    .apple-btn { border-radius: 12px; font-weight: 600; border: none; cursor: pointer; padding: 10px 18px;}
    .apple-btn-primary { background: #007aff; color: #fff;}
    .apple-btn-primary:hover { background: #0056b3;}
    .apple-btn:active { transform: scale(0.98);}
    .apple-input { background: #f0f0f0; border-radius: 12px; border: none; padding: 12px 16px;}
    .apple-input:focus { outline: 2px solid #007aff;}
    .apple-tab-nav { background: #e5e5ea; border-radius: 12px; padding: 4px; display: inline-flex;}
    .apple-tab-link { padding: 9px 18px; border-radius: 9px; font-weight: 500; color: #555; cursor: pointer;}
    .apple-tab-link.active { background: #fff; color: #007aff;}
    .modal-backdrop { backdrop-filter: blur(8px); background: rgba(0,0,0,0.4);}
  </style>
</head>
<body>
<div id="root"></div>
<script>
const TEACHER_EMAIL = "easonyichenge@gmail.com";
const firebaseConfig = {
  apiKey: "AIzaSyAWHcrQdzFIfi8x8MJCLu44Wz5dZOLqQoE",
  authDomain: "test-b5451.firebaseapp.com",
  projectId: "test-b5451",
  storageBucket: "test-b5451.appspot.com",
  messagingSenderId: "740966432025",
  appId: "1:740966432025:web:183468071fcf26c355d988"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

function getTodayString() {
  const now = new Date();
  return `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}-${String(now.getDate()).padStart(2,'0')}`;
}

function firestoreOnStudentsChange(cb) {
  db.collection('attendance').doc('students').onSnapshot(doc => {
    cb(doc.exists ? doc.data().list : []);
  });
}
async function firestoreSaveStudents(students) {
  await db.collection('attendance').doc('students').set({ list: students });
}
function firestoreOnAttendanceRecordsChange(cb) {
  db.collection('attendance').doc('records').onSnapshot(doc => {
    cb(doc.exists ? doc.data() : {});
  });
}
async function firestoreSaveAttendanceRecords(records) {
  await db.collection('attendance').doc('records').set(records);
}

// ========== UI區 ==========
function showLogin() {
  document.getElementById('root').innerHTML = `
    <div class="flex flex-col items-center justify-center min-h-screen">
      <div class="apple-card max-w-md w-full text-center">
        <h2 class="text-2xl font-bold mb-6">智慧點名系統</h2>
        <button id="google-login" class="apple-btn apple-btn-primary w-full text-lg py-3">以 Google 帳號登入</button>
        <p class="mt-4 text-gray-500">僅限老師帳號登入</p>
      </div>
    </div>
  `;
  document.getElementById("google-login").onclick = function() {
    const provider = new firebase.auth.GoogleAuthProvider();
    firebase.auth().signInWithRedirect(provider);
  };
}

function showTeacherView(email) {
  document.getElementById('root').innerHTML = `
    <div id="teacher-view">
      <div class="container mx-auto p-4 sm:p-6 md:p-8 max-w-3xl">
        <header class="text-center mb-8">
          <div class="flex justify-end">
            <span id="teacher-user-email" class="text-sm text-gray-500 mr-2">${email}</span>
            <button id="logout-btn" class="apple-btn px-3 py-1 bg-gray-200 text-gray-600 hover:bg-gray-300">登出</button>
          </div>
          <h1 class="text-4xl font-bold text-gray-900">智慧點名系統</h1>
          <p id="current-date" class="text-lg text-gray-600 mt-2"></p>
        </header>
        <div class="flex justify-center mb-8">
          <div id="tab-container" class="apple-tab-nav">
            <a id="tab-roll-call" class="apple-tab-link active">今日點名</a>
            <a id="tab-roster" class="apple-tab-link">學生名冊</a>
            <a id="tab-history" class="apple-tab-link">歷史紀錄</a>
          </div>
        </div>
        <main>
          <div id="page-roll-call">
            <div class="apple-card">
              <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4">
                <div>
                  <h2 class="text-2xl font-bold">今日點名冊</h2>
                  <p class="text-gray-500">點擊狀態按鈕來完成點名</p>
                </div>
                <div class="text-right flex-shrink-0">
                  <p class="font-semibold text-green-600">到課: <span id="present-count">0</span></p>
                  <p class="font-semibold text-red-600">缺席: <span id="absent-count">0</span></p>
                  <p class="font-semibold text-yellow-600">遲到: <span id="late-count">0</span></p>
                </div>
              </div>
              <div id="roll-call-list" class="space-y-3 max-h-[50vh] overflow-y-auto pr-2"></div>
            </div>
          </div>
          <div id="page-roster" class="hidden">
            <div class="apple-card">
              <h2 class="text-2xl font-bold mb-4">管理學生名冊</h2>
              <div class="flex flex-col sm:flex-row gap-2 mb-4">
                <input type="text" id="new-student-id" placeholder="學號" class="apple-input w-1/3">
                <input type="text" id="new-student-name" placeholder="姓名" class="flex-grow apple-input w-2/3">
                <button id="add-student-btn" class="w-full sm:w-auto apple-btn apple-btn-primary px-5 py-3 flex items-center justify-center gap-2">
                  新增
                </button>
              </div>
              <div id="roster-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2"></div>
            </div>
          </div>
          <div id="page-history" class="hidden">
            <div class="apple-card">
              <h2 class="text-2xl font-bold mb-4">查詢歷史點名紀錄</h2>
              <div id="history-list" class="space-y-2 max-h-[50vh] overflow-y-auto pr-2"></div>
            </div>
          </div>
        </main>
      </div>
    </div>
  `;
}

function runTeacherApp() {
  const currentDateEl = document.getElementById('current-date');
  const tabContainer = document.getElementById('tab-container');
  const tabs = {
    rollCall: document.getElementById('tab-roll-call'),
    roster: document.getElementById('tab-roster'),
    history: document.getElementById('tab-history'),
  };
  const pages = {
    rollCall: document.getElementById('page-roll-call'),
    roster: document.getElementById('page-roster'),
    history: document.getElementById('page-history'),
  };
  const rollCallList = document.getElementById('roll-call-list');
  const presentCountEl = document.getElementById('present-count');
  const absentCountEl = document.getElementById('absent-count');
  const lateCountEl = document.getElementById('late-count');
  const rosterList = document.getElementById('roster-list');
  const newStudentIdInput = document.getElementById('new-student-id');
  const newStudentNameInput = document.getElementById('new-student-name');
  const addStudentBtn = document.getElementById('add-student-btn');
  const historyList = document.getElementById('history-list');
  let students = [];
  let attendanceRecords = {};
  const todayString = getTodayString();

  firestoreOnStudentsChange(list => {
    students = list;
    renderRosterList();
    renderRollCallList();
  });
  firestoreOnAttendanceRecordsChange(records => {
    attendanceRecords = records;
    if (!attendanceRecords[todayString]) attendanceRecords[todayString] = {};
    renderRollCallList();
    renderHistory();
  });

  function renderRollCallList() {
    rollCallList.innerHTML = '';
    if (students.length === 0) {
      rollCallList.innerHTML = `<p class="text-gray-500 text-center py-4">請先到「學生名冊」新增學生。</p>`;
      updateCounts(); return;
    }
    students.forEach(s => {
      const status = attendanceRecords[todayString]?.[s.id] || 'unknown';
      const item = document.createElement('div');
      item.className = `flex items-center justify-between p-4 bg-gray-50 rounded-xl transition hover:bg-gray-100`;
      item.innerHTML = `
        <div>
          <p class="font-semibold text-lg">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
        </div>
        <div class="flex space-x-2">
          <button data-id="${s.id}" data-status="present" class="px-3 py-1 text-sm rounded-full ${status === 'present' ? 'bg-green-500 text-white' : 'bg-gray-200'}">到課</button>
          <button data-id="${s.id}" data-status="absent" class="px-3 py-1 text-sm rounded-full ${status === 'absent' ? 'bg-red-500 text-white' : 'bg-gray-200'}">缺席</button>
          <button data-id="${s.id}" data-status="late" class="px-3 py-1 text-sm rounded-full ${status === 'late' ? 'bg-yellow-500 text-white' : 'bg-gray-200'}">遲到</button>
        </div>
      `;
      rollCallList.appendChild(item);
    });
    updateCounts();
  }
  function updateCounts() {
    const records = Object.values(attendanceRecords[todayString] || {});
    presentCountEl.textContent = records.filter(s => s === 'present').length;
    absentCountEl.textContent = records.filter(s => s === 'absent').length;
    lateCountEl.textContent = records.filter(s => s === 'late').length;
  }
  function renderRosterList() {
    rosterList.innerHTML = '';
    if (students.length === 0) {
      rosterList.innerHTML = `<p class="text-gray-500 text-center py-4">目前沒有學生。</p>`; return;
    }
    students.forEach(s => {
      const item = document.createElement('div');
      item.className = 'flex items-center justify-between p-4 bg-gray-50 rounded-xl';
      item.innerHTML = `<div>
        <p class="font-semibold">${s.name} <span class="text-sm text-gray-500 ml-2">(${s.id})</span></p>
      </div>
      <div>
        <button data-id="${s.id}" class="delete-student-btn text-red-500 hover:text-red-700">刪除</button>
      </div>`;
      rosterList.appendChild(item);
    });
  }
  function renderHistory() {
    historyList.innerHTML = '';
    const dates = Object.keys(attendanceRecords).sort();
    if (dates.length === 0) {
      historyList.innerHTML = `<p class="text-gray-500 text-center py-4">目前無任何歷史紀錄。</p>`;
      return;
    }
    dates.forEach(date => {
      const rec = attendanceRecords[date] || {};
      const line = document.createElement('div');
      line.className = "p-2 bg-gray-100 rounded mb-2";
      line.innerHTML = `<b>${date}</b><br>` + students.map(s =>
        `<span class="inline-block mr-3">${s.name}(${s.id}): <span class="${
          rec[s.id]==='present' ? 'text-green-600' : rec[s.id]==='absent' ? 'text-red-600' : rec[s.id]==='late' ? 'text-yellow-600' : 'text-gray-400'
        }">${rec[s.id]||'--'}</span></span>`
      ).join('');
      historyList.appendChild(line);
    });
  }
  rollCallList.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-status]');
    if (btn) {
      if (!attendanceRecords[todayString]) attendanceRecords[todayString] = {};
      attendanceRecords[todayString][btn.dataset.id] = btn.dataset.status;
      await firestoreSaveAttendanceRecords(attendanceRecords);
    }
  });
  rosterList.addEventListener('click', async (e) => {
    const btn = e.target.closest('.delete-student-btn');
    if (btn) {
      const studentId = btn.dataset.id;
      students = students.filter(s => s.id !== studentId);
      await firestoreSaveStudents(students);
    }
  });
  addStudentBtn.addEventListener('click', async () => {
    const id = newStudentIdInput.value.trim();
    const name = newStudentNameInput.value.trim();
    if (id && name) {
      if (students.some(s => s.id === id)) {
        alert("已有相同學號的學生！");
        return;
      }
      students.push({ id, name });
      newStudentIdInput.value = '';
      newStudentNameInput.value = '';
      await firestoreSaveStudents(students);
    }
  });
  currentDateEl.textContent = `${todayString.replace(/-/g, " 年 ").replace(/$/, " 日").replace(/-(\d+) 年 /, " 月 ")}`;
  tabContainer.addEventListener('click', (e) => {
    if(e.target.classList.contains('apple-tab-link')) {
      Object.values(tabs).forEach(t => t.classList.remove('active'));
      Object.values(pages).forEach(p => p.classList.add('hidden'));
      e.target.classList.add('active');
      const pageId = 'page-' + e.target.id.split('-').slice(1).join('-');
      const pageElement = document.getElementById(pageId);
      if (pageElement) pageElement.classList.remove('hidden');
    }
  });
}

// ========== 登入流程 ==========
window.onload = function() {
  firebase.auth().getRedirectResult().then(function(result) {
    // 登入後會觸發 onAuthStateChanged
  }).catch(function(error) {
    alert(error.message);
  });
  firebase.auth().onAuthStateChanged(function(user) {
    if (!user) { showLogin(); return; }
    const email = (user.email || '').toLowerCase();
    if (email === TEACHER_EMAIL) {
      showTeacherView(email);
      runTeacherApp();
    } else {
      document.getElementById('root').innerHTML = `<div class="apple-card max-w-md mx-auto mt-20 text-center"><h2 class="text-2xl font-bold mb-3">非授權帳號</h2><p>你的帳號 ${email} 不是老師帳號，無法使用此系統。</p></div>`;
    }
  });
};

document.addEventListener("click", function(e){
  if(e.target && e.target.id === "logout-btn") {
    firebase.auth().signOut().then(()=>location.reload());
  }
});

// Firestore 快取/監聽
function firestoreOnStudentsChange(cb) {
  db.collection('attendance').doc('students').onSnapshot(doc => {
    cb(doc.exists ? doc.data().list : []);
  });
}
async function firestoreSaveStudents(students) {
  await db.collection('attendance').doc('students').set({ list: students });
}
function firestoreOnAttendanceRecordsChange(cb) {
  db.collection('attendance').doc('records').onSnapshot(doc => {
    cb(doc.exists ? doc.data() : {});
  });
}
async function firestoreSaveAttendanceRecords(records) {
  await db.collection('attendance').doc('records').set(records);
}
</script>
</body>
</html>
