<!DOCTYPE html>
<html lang="zh-TW" class="antialiased">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RSS Reader</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 設定 Tailwind 使用 class 模式切換深色 -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        // Apple System Colors
                        apple: {
                            blue: '#007AFF',
                            gray: '#8E8E93',
                            lightBg: '#F2F2F7',
                            darkBg: '#000000',
                            cardLight: '#FFFFFF',
                            cardDark: '#1C1C1E',
                            borderLight: '#C6C6C8',
                            borderDark: '#38383A',
                            textLight: '#000000',
                            textDark: '#FFFFFF'
                        }
                    },
                    fontFamily: {
                        sans: [
                            '-apple-system', 
                            'BlinkMacSystemFont', 
                            '"Segoe UI"', 
                            'Roboto', 
                            '"Helvetica Neue"', 
                            'Arial', 
                            '"Noto Sans TC"', 
                            'sans-serif'
                        ]
                    }
                }
            }
        }
    </script>

    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&display=swap" rel="stylesheet">

    <style>
        /* 自定義捲軸 (隱藏式/極簡) */
        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        
        /* 內容區捲軸 */
        .custom-scroll::-webkit-scrollbar {
            width: 6px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: transparent;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(156, 163, 175, 0.5);
            border-radius: 3px;
        }
        .dark .custom-scroll::-webkit-scrollbar-thumb {
            background-color: rgba(75, 85, 99, 0.5);
        }

        /* Loading 動畫 */
        .loader {
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-left-color: #007AFF;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        .dark .loader {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-left-color: #0A84FF;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-apple-lightBg dark:bg-apple-darkBg text-apple-textLight dark:text-apple-textDark transition-colors duration-300 h-screen overflow-hidden flex flex-col md:flex-row">

    <!-- 左側欄 (導航與訂閱列表) -->
    <aside class="w-full md:w-80 flex-shrink-0 flex flex-col bg-apple-lightBg/80 dark:bg-apple-darkBg/80 md:border-r border-apple-borderLight dark:border-apple-borderDark backdrop-blur-xl z-20 h-[40vh] md:h-full transition-colors duration-300">
        
        <!-- 頂部工具列 -->
        <header class="px-4 py-3 flex justify-between items-center border-b border-apple-borderLight dark:border-apple-borderDark">
            <h1 class="text-xl font-bold tracking-tight">RSS Reader</h1>
            <div class="flex gap-2">
                <!-- 通知按鈕 -->
                <button id="notify-btn" onclick="requestNotificationPermission()" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition text-apple-gray" title="開啟通知">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path></svg>
                </button>
                <!-- 深色模式切換 -->
                <button id="theme-toggle" class="p-2 rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition text-apple-gray">
                    <!-- 太陽圖示 -->
                    <svg id="icon-sun" class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
                    <!-- 月亮圖示 -->
                    <svg id="icon-moon" class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
                </button>
            </div>
        </header>

        <!-- 新增訂閱區 -->
        <div class="px-4 py-3">
            <div class="relative">
                <input type="url" id="rss-url-input" placeholder="輸入 RSS 網址..." class="w-full bg-gray-200 dark:bg-gray-800 text-sm rounded-lg pl-9 pr-3 py-2 focus:outline-none focus:ring-2 focus:ring-apple-blue transition-colors placeholder-gray-500 dark:text-white">
                <div class="absolute left-3 top-2.5 text-gray-500">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                </div>
                <button id="add-feed-btn" onclick="addFeed()" class="absolute right-1.5 top-1.5 bg-apple-blue text-white rounded-md px-2 py-0.5 text-xs font-medium hover:bg-blue-600 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    加入
                </button>
            </div>
            <p id="status-message" class="text-xs text-center mt-2 h-4 text-red-500 truncate"></p>
        </div>

        <!-- 訂閱列表 -->
        <div class="flex-1 overflow-y-auto custom-scroll px-2 pb-2 space-y-1" id="feeds-list">
            <!-- 列表項目將由 JS 生成 -->
            <div class="text-center py-10 text-apple-gray text-sm">
                <p>載入中...</p>
            </div>
        </div>
        
        <!-- 底部狀態 -->
        <div class="px-4 py-2 border-t border-apple-borderLight dark:border-apple-borderDark text-[10px] text-center text-apple-gray">
            ID: <span id="user-id">...</span>
        </div>
    </aside>

    <!-- 右側主內容區 -->
    <main class="flex-1 flex flex-col h-[60vh] md:h-full bg-apple-cardLight dark:bg-apple-cardDark transition-colors duration-300 relative z-10 shadow-2xl md:shadow-none">
        
        <!-- 文章列表標題 -->
        <header class="px-6 py-4 border-b border-apple-borderLight dark:border-apple-borderDark flex justify-between items-center bg-apple-cardLight/90 dark:bg-apple-cardDark/90 backdrop-blur sticky top-0 z-10">
            <div>
                <h2 id="feed-title-display" class="text-2xl font-bold truncate max-w-[200px] md:max-w-lg">歡迎使用</h2>
                <p class="text-xs text-apple-gray mt-0.5">選擇左側頻道以閱讀文章</p>
            </div>
            <div id="loading-indicator" class="hidden">
                <div class="loader"></div>
            </div>
        </header>

        <!-- 文章列表內容 -->
        <div id="feed-items-display" class="flex-1 overflow-y-auto custom-scroll p-0 md:p-6 space-y-0 md:space-y-4">
            
            <!-- 歡迎畫面 / 空狀態 -->
            <div class="flex flex-col items-center justify-center h-full text-apple-gray space-y-4">
                <svg class="w-16 h-16 opacity-20" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                <p>請從左側選擇一個訂閱來源</p>
            </div>

        </div>
    </main>

    <!-- JavaScript -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, collection, onSnapshot, setDoc, addDoc, deleteDoc, query, serverTimestamp, updateDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // Firebase 設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyAJYhHtyWFW5tdQNi6pJ982tVrYDbnxTVA",
            authDomain: "eason-rss-notification.firebaseapp.com",
            projectId: "eason-rss-notification",
            storageBucket: "eason-rss-notification.firebasestorage.app",
            messagingSenderId: "308859483194",
            appId: "1:308859483194:web:080fef18c7a628a2773103",
            measurementId: "G-HGMSTK3S6B"
        };

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        let currentUserId = null;
        let notificationPermission = "default";
        const CORS_PROXY = 'https://api.allorigins.win/get?url=';
        const UPDATE_INTERVAL_MS = 600000; // 10 分鐘

        // DOM 元素
        const inputUrl = document.getElementById('rss-url-input');
        const addBtn = document.getElementById('add-feed-btn');
        const statusMsg = document.getElementById('status-message');
        const feedsList = document.getElementById('feeds-list');
        const itemsDisplay = document.getElementById('feed-items-display');
        const titleDisplay = document.getElementById('feed-title-display');
        const userIdSpan = document.getElementById('user-id');
        const loadingIndicator = document.getElementById('loading-indicator');
        const notifyBtn = document.getElementById('notify-btn');

        // 暴露函數給 HTML
        window.addFeed = addFeed;
        window.deleteFeed = deleteFeed;
        window.displayFeedItems = displayFeedItems;
        window.requestNotificationPermission = requestNotificationPermission;

        // ==========================================
        // 1. 深色模式邏輯
        // ==========================================
        const themeToggleBtn = document.getElementById('theme-toggle');
        
        // 檢查本地存儲或系統偏好
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        } else {
            document.documentElement.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', function() {
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        // ==========================================
        // 2. Firebase 認證與初始化
        // ==========================================
        signInAnonymously(auth).catch((error) => {
            console.error("Auth Error:", error);
            let msg = "無法連線到資料庫";
            if (error.code === 'auth/configuration-not-found') {
                msg = "請至 Firebase Console 啟用匿名登入功能";
            }
            statusMsg.textContent = msg;
        });

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUserId = user.uid;
                userIdSpan.textContent = user.uid.substring(0, 6) + "...";
                addBtn.disabled = false;
                checkNotificationStatus();
                listenForFeeds();
            } else {
                currentUserId = null;
            }
        });

        function getFeedsCollectionRef() {
            if (!currentUserId) return null;
            return collection(db, 'users', currentUserId, 'rss_feeds');
        }

        // ==========================================
        // 3. 核心功能：新增、刪除、監聽
        // ==========================================
        async function addFeed(urlInput = null) {
            const url = urlInput || inputUrl.value.trim();
            if (!url) return;

            if (!urlInput) {
                addBtn.disabled = true;
                addBtn.textContent = "...";
                statusMsg.textContent = "正在驗證...";
                statusMsg.className = "text-xs text-center mt-2 h-4 text-blue-500 truncate";
            }

            try {
                const q = query(getFeedsCollectionRef());
                const snapshot = await getDocs(q);
                if (snapshot.docs.some(d => d.data().url === url)) {
                    throw new Error("此網站已在訂閱清單中");
                }

                await addDoc(getFeedsCollectionRef(), {
                    url: url,
                    title: url, 
                    last_fetched: null,
                    items: [],
                    timestamp: serverTimestamp()
                });

                if (!urlInput) {
                    inputUrl.value = '';
                    statusMsg.textContent = "";
                }
            } catch (e) {
                console.error(e);
                if (!urlInput) {
                    statusMsg.textContent = e.message;
                    statusMsg.className = "text-xs text-center mt-2 h-4 text-red-500 truncate";
                }
            } finally {
                if (!urlInput) {
                    addBtn.disabled = false;
                    addBtn.textContent = "加入";
                }
            }
        }

        async function deleteFeed(id) {
            if (confirm("確定要移除此訂閱嗎？")) {
                await deleteDoc(doc(getFeedsCollectionRef(), id));
                // 如果刪除的是當前顯示的，清空畫面
                titleDisplay.textContent = "RSS Reader";
                titleDisplay.nextElementSibling.textContent = "選擇左側頻道以閱讀文章";
                itemsDisplay.innerHTML = `<div class="flex flex-col items-center justify-center h-full text-apple-gray space-y-4"><p>已刪除訂閱</p></div>`;
            }
        }

        function listenForFeeds() {
            onSnapshot(getFeedsCollectionRef(), async (snapshot) => {
                // 自動加入預設訂閱
                if (snapshot.empty) {
                    await addFeed("https://www.apple.com/tw/newsroom/rss-feed.rss");
                    return;
                }

                const feeds = [];
                snapshot.docChanges().forEach(change => {
                    const data = change.doc.data();
                    if (change.type !== 'removed') {
                        const now = Date.now();
                        const last = data.last_fetched ? data.last_fetched.toDate().getTime() : 0;
                        // 檢查更新
                        if ((now - last > UPDATE_INTERVAL_MS) || (!data.last_fetched)) {
                            fetchFeed({ id: change.doc.id, ...data });
                        }
                    }
                });
                
                snapshot.forEach(doc => feeds.push({ id: doc.id, ...doc.data() }));
                renderFeedList(feeds);
            });
        }

        // ==========================================
        // 4. RSS 抓取與解析
        // ==========================================
        async function fetchFeed(feed) {
            loadingIndicator.classList.remove('hidden');
            try {
                const res = await fetch(CORS_PROXY + encodeURIComponent(feed.url));
                const data = await res.json();
                if (!data.contents) throw new Error("No Content");

                const parser = new DOMParser();
                const xml = parser.parseFromString(data.contents, "text/xml");

                let title = feed.title;
                // 只有在 title 還是網址時才更新標題，允許用戶未來改名(雖然目前UI沒做改名)
                if (feed.title === feed.url) {
                    const channelTitle = xml.querySelector('channel > title, feed > title');
                    if (channelTitle) title = channelTitle.textContent;
                }

                const items = [];
                const nodes = xml.querySelectorAll('item, entry');
                
                nodes.forEach((node, index) => {
                    if (index >= 20) return;
                    const linkNode = node.querySelector('link');
                    const link = linkNode ? (linkNode.textContent || linkNode.getAttribute('href')) : '#';
                    items.push({
                        title: node.querySelector('title')?.textContent || '無標題',
                        link: link,
                        pubDate: node.querySelector('pubDate, published, updated')?.textContent || '',
                        description: node.querySelector('description, summary, content')?.textContent || '',
                        guid: node.querySelector('guid, id')?.textContent || link
                    });
                });

                // 通知邏輯
                if (items.length > 0 && feed.items && feed.items.length > 0) {
                    if (items[0].link !== feed.items[0].link && feed.last_fetched) {
                        sendNotification(title, items[0].title);
                    }
                }

                await updateDoc(doc(getFeedsCollectionRef(), feed.id), {
                    title: title,
                    items: items,
                    last_fetched: serverTimestamp()
                });

            } catch (e) {
                console.error(`Fetch error for ${feed.url}:`, e);
                // 更新時間避免無限重試
                await updateDoc(doc(getFeedsCollectionRef(), feed.id), { last_fetched: serverTimestamp() });
            } finally {
                loadingIndicator.classList.add('hidden');
            }
        }

        // ==========================================
        // 5. UI 渲染
        // ==========================================
        function renderFeedList(feeds) {
            feedsList.innerHTML = '';
            if (feeds.length === 0) {
                feedsList.innerHTML = `<p class="text-center text-xs text-apple-gray mt-10">暫無訂閱</p>`;
                return;
            }

            feeds.forEach(feed => {
                const div = document.createElement('div');
                // Apple 風格列表項目
                div.className = `
                    group flex items-center justify-between px-3 py-2 rounded-lg cursor-pointer
                    hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors
                    ${feed.title === titleDisplay.textContent ? 'bg-gray-200 dark:bg-gray-800' : ''}
                `;
                
                // 未讀標記 (簡單邏輯：如果剛更新)
                const isRecent = feed.last_fetched && (Date.now() - feed.last_fetched.toDate().getTime() < 60000);
                const indicatorClass = isRecent ? 'bg-blue-500' : 'bg-transparent';

                div.innerHTML = `
                    <div class="flex items-center space-x-3 overflow-hidden">
                        <div class="w-2 h-2 rounded-full ${indicatorClass} flex-shrink-0"></div>
                        <div class="flex flex-col overflow-hidden">
                            <span class="text-sm font-medium truncate text-apple-textLight dark:text-apple-textDark">${feed.title}</span>
                            <span class="text-[10px] text-apple-gray truncate">${feed.url}</span>
                        </div>
                    </div>
                    <button onclick="event.stopPropagation();deleteFeed('${feed.id}')" class="opacity-0 group-hover:opacity-100 p-1 text-apple-gray hover:text-red-500 transition-opacity">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                    </button>
                `;
                
                div.onclick = () => {
                    // 移除其他選中狀態
                    Array.from(feedsList.children).forEach(c => c.classList.remove('bg-gray-200', 'dark:bg-gray-800'));
                    div.classList.add('bg-gray-200', 'dark:bg-gray-800');
                    displayFeedItems(feed);
                };
                
                feedsList.appendChild(div);
            });
        }

        function displayFeedItems(feed) {
            titleDisplay.textContent = feed.title;
            titleDisplay.nextElementSibling.textContent = `共 ${feed.items ? feed.items.length : 0} 篇文章`;
            itemsDisplay.innerHTML = '';

            // 切換到移動版的內容視圖 (如果是在手機上)
            // 這裡可以加邏輯，但目前保持簡單

            (feed.items || []).forEach(item => {
                const dateStr = item.pubDate ? new Date(item.pubDate).toLocaleDateString('zh-TW') : '';
                const cleanDesc = (item.description || '').replace(/<[^>]+>/g, '').substring(0, 150) + '...';

                const article = document.createElement('article');
                // 卡片樣式
                article.className = `
                    bg-white dark:bg-apple-cardDark p-5 md:rounded-2xl
                    border-b md:border border-apple-borderLight dark:border-apple-borderDark
                    hover:shadow-lg transition-all duration-200 group
                `;
                
                article.innerHTML = `
                    <div class="flex flex-col gap-2">
                        <div class="flex justify-between items-start">
                            <a href="${item.link}" target="_blank" class="text-lg font-bold text-apple-textLight dark:text-apple-textDark group-hover:text-apple-blue transition-colors leading-tight">
                                ${item.title}
                            </a>
                        </div>
                        <p class="text-sm text-apple-gray line-clamp-2 leading-relaxed">${cleanDesc}</p>
                        <div class="flex justify-between items-center mt-2">
                            <span class="text-xs text-apple-gray bg-gray-100 dark:bg-gray-800 px-2 py-1 rounded-md">${dateStr}</span>
                            <a href="${item.link}" target="_blank" class="text-xs font-medium text-apple-blue flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                閱讀更多 <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                            </a>
                        </div>
                    </div>
                `;
                itemsDisplay.appendChild(article);
            });
        }

        // ==========================================
        // 6. 通知權限
        // ==========================================
        function checkNotificationStatus() {
            if ("Notification" in window) {
                notificationPermission = Notification.permission;
                updateNotifyIcon();
            } else {
                notifyBtn.style.display = 'none';
            }
        }

        async function requestNotificationPermission() {
            const p = await Notification.requestPermission();
            notificationPermission = p;
            updateNotifyIcon();
            if(p === 'granted') {
                new Notification("通知已開啟", { body: "當有新文章時您將會收到通知" });
            }
        }

        function updateNotifyIcon() {
            if (notificationPermission === 'granted') {
                notifyBtn.classList.add('text-apple-blue');
                notifyBtn.classList.remove('text-apple-gray');
            }
        }

        function sendNotification(site, title) {
            if (notificationPermission === 'granted') {
                new Notification(`新文章: ${site}`, { body: title });
            }
        }
    </script>
</body>
</html>
