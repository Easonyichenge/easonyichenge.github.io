<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>台灣大眾運輸即時動態行控中心 | Taiwan Transit OCC</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="occ-container">
        <!-- Header / Top Bar -->
        <header class="occ-header">
            <div class="header-left">
                <div class="logo-area">
                    <h1>台灣大眾運輸即時動態行控中心</h1>
                </div>
                <div class="system-status-indicator">
                    <span class="status-dot"></span>
                    <span class="status-text">系統正常運作</span>
                </div>
            </div>
            <div class="header-center">
                <div class="clock-display" id="main-clock">00:00:00</div>
                <div class="date-display" id="main-date">2024年1月1日</div>
            </div>
            <div class="header-right">
                <button id="theme-toggle" class="theme-btn" aria-label="Toggle Dark Mode">
                    <span class="icon">🌙</span>
                </button>
                <div class="weather-widget">
                    <span class="weather-icon">🌤</span>
                    <span class="weather-temp">28°C</span>
                    <span class="weather-loc">台北市</span>
                </div>
            </div>
        </header>

        <!-- Main Content Grid -->
        <main class="occ-grid">
            <!-- Left Panel: Network Status -->
            <aside class="panel left-panel">
                <div class="panel-header">
                    <h2>路網狀態監控</h2>
                </div>
                <div class="panel-content">
                    <div class="status-card" id="status-hsr">
                        <div class="card-header">
                            <span class="card-title">台灣高鐵 (THSR)</span>
                            <span class="card-value">98%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill" style="width: 98%"></div>
                        </div>
                    </div>
                    <div class="status-card" id="status-tra">
                        <div class="card-header">
                            <span class="card-title">台灣鐵路 (TRA)</span>
                            <span class="card-value">92%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill warning" style="width: 92%"></div>
                        </div>
                    </div>

                    <!-- City MRTs -->
                    <div class="status-card" id="status-trtc">
                        <div class="card-header">
                            <span class="card-title">台北捷運 (TRTC)</span>
                            <span class="card-value">100%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="status-card" id="status-krtc">
                        <div class="card-header">
                            <span class="card-title">高雄捷運 (KRTC)</span>
                            <span class="card-value">99%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill" style="width: 99%"></div>
                        </div>
                    </div>
                    <div class="status-card" id="status-tmrt">
                        <div class="card-header">
                            <span class="card-title">台中捷運 (TMRT)</span>
                            <span class="card-value">100%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill" style="width: 100%"></div>
                        </div>
                    </div>
                    <div class="status-card" id="status-tymrt">
                        <div class="card-header">
                            <span class="card-title">桃園捷運 (TYMRT)</span>
                            <span class="card-value">98%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill" style="width: 98%"></div>
                        </div>
                    </div>
                    <div class="status-card" id="status-ntpc">
                        <div class="card-header">
                            <span class="card-title">新北輕軌 (NTPC)</span>
                            <span class="card-value">97%</span>
                        </div>
                        <div class="card-bar">
                            <div class="fill" style="width: 97%"></div>
                        </div>
                    </div>
                </div>

    </div>
    </aside>

    <!-- Center Panel: Map -->
    <section class="panel map-panel">
        <div class="map-overlay-top">
            <div class="stat-item">
                <span class="label">線上列車</span>
                <span class="value" id="active-trains-count">0</span>
            </div>
            <div class="stat-item">
                <span class="label">即時運量</span>
                <span class="value" id="passenger-count">0</span>
            </div>
        </div>
        <div id="map"></div>
        <div class="map-overlay-bottom">
            <div class="layer-controls">
                <button class="layer-btn active" data-layer="hsr">高鐵</button>
                <button class="layer-btn active" data-layer="tra">台鐵</button>
                <button class="layer-btn active" data-layer="mrt">捷運/輕軌</button>
            </div>
        </div>
    </section>

    <!-- Right Panel: Details & Analytics -->
    <aside class="panel right-panel">
        <div class="panel-header">
            <h2>即時數據分析</h2>
        </div>
        <div class="panel-content">
            <div class="metric-box">
                <h3>即時人流趨勢</h3>
                <div class="chart-container">
                    <canvas id="passenger-chart"></canvas>
                </div>
            </div>
            <div class="metric-box">
                <h3>平均營運速率 (km/h)</h3>
                <div class="chart-container">
                    <canvas id="speed-chart"></canvas>
                </div>
            </div>
            <div class="metric-box">
                <h3>事件紀錄</h3>
                <div class="log-entry">
                    <span class="time">10:42</span>
                    <span class="msg">板橋站信號檢測正常</span>
                </div>
                <div class="log-entry">
                    <span class="time">10:38</span>
                    <span class="msg">台北車站月台人流疏導</span>
                </div>
            </div>

            <div class="alert-feed">
                <h3>即時通告</h3>
                <ul id="alert-list">
                    <li class="alert-item info"><span class="alert-tag">資訊</span> 系統初始化完成，開始監控。</li>
                </ul>
            </div>
        </div>
    </aside>
    </main>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- Routes Data -->
    <script src="routes.js"></script>
    <!-- Main JS -->
    <script src="main.js"></script>
</body>

</html>
