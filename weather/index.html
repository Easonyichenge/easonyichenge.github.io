<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
    <meta name="theme-color" content="#1c1c1e" media="(prefers-color-scheme: dark)">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>台灣天氣</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
</head>

<body>
    <!-- 主容器 -->
    <div class="app">
        <!-- 颱風警示 (移到 app 內部) -->
        <div class="typhoon-alert hidden" id="typhoonBanner">
            <svg class="typhoon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="3" />
                <path d="M12 2a10 10 0 0 1 0 20 10 10 0 0 1 0-20" />
                <path d="M12 2c3 3 4 7 4 10s-1 7-4 10" />
                <path d="M12 2c-3 3-4 7-4 10s1 7 4 10" />
            </svg>
            <div class="typhoon-content">
                <strong id="typhoonTitle">颱風警報</strong>
                <div class="typhoon-stats" id="typhoonDesc"></div>
            </div>
        </div>
        <!-- 頂部導航 -->
        <header class="header">
            <div class="header-left">
                <svg class="logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                    <circle cx="12" cy="12" r="5" />
                    <path
                        d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                </svg>
                <h1 class="app-title">台灣天氣</h1>
            </div>
            <div class="header-right">
                <div class="select-box">
                    <select id="citySelect">
                        <option value="">選擇縣市</option>
                    </select>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </div>
                <div class="select-box" id="districtSelectBox">
                    <select id="districtSelect">
                        <option value="">選擇鄉鎮</option>
                    </select>
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9" />
                    </svg>
                </div>
                <div class="time-badge" id="updateTime">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    <span>--:--</span>
                </div>
                <button class="icon-btn" id="autoLocateBtn" title="自動定位">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="3" />
                        <path d="M12 2v4M12 18v4M2 12h4M18 12h4" />
                    </svg>
                </button>
                <button class="icon-btn" id="refreshBtn" title="重新整理">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M23 4v6h-6M1 20v-6h6" />
                        <path d="M3.51 9a9 9 0 0114.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0020.49 15" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- 跑馬燈 -->
        <div class="ticker" id="tickerBar">
            <div class="ticker-track" id="tickerContent">
                <span class="ticker-text">載入天氣資訊中...</span>
            </div>
        </div>

        <!-- 主要內容 -->
        <main class="main">
            <!-- 左側 -->
            <div class="left-col">
                <!-- 天氣主卡片 -->
                <section class="hero-card" id="heroWeather">
                    <div class="hero-empty">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                            <circle cx="12" cy="12" r="5" />
                            <path
                                d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
                        </svg>
                        <p>選擇縣市查看天氣</p>
                    </div>
                </section>

                <!-- 數據統計 -->
                <section class="stats-row" id="quickStats">
                    <div class="stat-box">
                        <div class="stat-icon blue">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 2.69l5.66 5.66a8 8 0 11-11.31 0z" />
                            </svg>
                        </div>
                        <div class="stat-content">
                            <span class="stat-num" id="statHumidity">--%</span>
                            <span class="stat-name">濕度</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon purple">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path
                                    d="M9.59 4.59A2 2 0 1111 8H2m10.59 11.41A2 2 0 1014 16H2m15.73-8.27A2.5 2.5 0 1119.5 12H2" />
                            </svg>
                        </div>
                        <div class="stat-content">
                            <span class="stat-num" id="statWind">--</span>
                            <span class="stat-name">風速</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon cyan">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M16 13v8M8 13v8M12 15v8" />
                                <path d="M20 16.58A5 5 0 0018 7h-1.26A8 8 0 104 15.25" />
                            </svg>
                        </div>
                        <div class="stat-content">
                            <span class="stat-num" id="statRain">--%</span>
                            <span class="stat-name">降雨機率</span>
                        </div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-icon orange">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M14 14.76V3.5a2.5 2.5 0 00-5 0v11.26a4.5 4.5 0 105 0z" />
                            </svg>
                        </div>
                        <div class="stat-content">
                            <span class="stat-num" id="statFeels">--°</span>
                            <span class="stat-name">體感溫度</span>
                        </div>
                    </div>
                </section>

                <!-- 未來36小時天氣預報 -->
                <section class="card" id="forecastSection">
                    <div class="card-head">
                        <h3 id="forecastTitle">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M17 18a5 5 0 00-10 0" />
                                <line x1="12" y1="9" x2="12" y2="2" />
                                <line x1="4.22" y1="10.22" x2="5.64" y2="11.64" />
                                <line x1="1" y1="18" x2="3" y2="18" />
                                <line x1="21" y1="18" x2="23" y2="18" />
                                <line x1="18.36" y1="11.64" x2="19.78" y2="10.22" />
                                <line x1="23" y1="22" x2="1" y2="22" />
                                <polyline points="16,5 12,9 8,5" />
                            </svg>
                            未來36小時天氣
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="forecast-grid" id="forecastScroll"></div>
                    </div>
                </section>

                <!-- 一週天氣預報 -->
                <section class="card week-forecast-section" id="weekForecastSection">
                    <div class="card-head">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" />
                                <line x1="16" y1="2" x2="16" y2="6" />
                                <line x1="8" y1="2" x2="8" y2="6" />
                                <line x1="3" y1="10" x2="21" y2="10" />
                            </svg>
                            一週天氣預報
                        </h3>
                    </div>
                    <div class="card-body">
                        <div class="week-forecast-grid" id="weekForecastGrid">
                            <div class="empty">選擇縣市查看一週天氣</div>
                        </div>
                    </div>
                </section>

                <!-- 即時觀測 -->
                <section class="card obs-section">
                    <div class="card-head">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10" />
                                <polyline points="12,6 12,12 16,14" />
                            </svg>
                            即時觀測
                        </h3>
                        <div class="obs-controls">
                            <div class="search-box">
                                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="11" cy="11" r="8" />
                                    <path d="M21 21l-4.35-4.35" />
                                </svg>
                                <input type="text" id="obsSearch" placeholder="搜尋觀測站...">
                            </div>
                            <div class="tabs">
                                <button class="tab active" data-type="weather">氣象站</button>
                                <button class="tab" data-type="rain">雨量站</button>
                                <button class="tab" data-type="uv">紫外線</button>
                            </div>
                        </div>
                    </div>
                    <div class="card-body" id="obsGrid">
                        <div class="empty">選擇縣市查看觀測資料</div>
                    </div>
                </section>

                <!-- 天文 -->
                <section class="card astro-section">
                    <div class="card-head">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="5" />
                                <line x1="12" y1="1" x2="12" y2="3" />
                                <line x1="12" y1="21" x2="12" y2="23" />
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                                <line x1="1" y1="12" x2="3" y2="12" />
                                <line x1="21" y1="12" x2="23" y2="12" />
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                            </svg>
                            天文資訊
                        </h3>
                    </div>
                    <div class="card-body astro-row" id="astroCards">
                        <div class="empty">選擇縣市查看天文資訊</div>
                    </div>
                </section>
            </div>

            <!-- 右側地圖 -->
            <aside class="right-col">
                <div class="card map-card">
                    <div class="card-head">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <polygon points="1,6 1,22 8,18 16,22 23,18 23,2 16,6 8,2 1,6" />
                                <line x1="8" y1="2" x2="8" y2="18" />
                                <line x1="16" y1="6" x2="16" y2="22" />
                            </svg>
                            全台天氣
                        </h3>
                    </div>
                    <!-- Leaflet 地圖 -->
                    <div class="map-wrapper">
                        <div id="taiwanMap" class="leaflet-map"></div>
                    </div>
                    <!-- 城市列表 -->
                    <div class="city-list" id="taiwanWeatherList">
                        <div class="empty">載入中...</div>
                    </div>
                </div>

                <!-- 警特報 -->
                <section class="card warning-section hidden" id="warningSection">
                    <div class="card-head">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                                stroke-linecap="round" stroke-linejoin="round">
                                <path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z" />
                                <path d="M12 9v4" />
                                <path d="M12 17h.01" />
                            </svg>
                            氣象警特報
                        </h3>
                    </div>
                    <div class="card-body" id="warningList"></div>
                </section>

                <!-- 最近地震 -->
                <section class="card earthquake-section">
                    <div class="card-head">
                        <h3>
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M2 12h2l3-9 4 18 4-12 3 6h4" />
                            </svg>
                            最近地震
                        </h3>
                    </div>
                    <div class="card-body" id="earthquakeList">
                        <div class="empty">載入中...</div>
                    </div>
                </section>
            </aside>
        </main>
    </div>

    <!-- Modal -->
    <div class="modal-bg" id="modalOverlay">
        <div class="modal">
            <div class="modal-head">
                <h3>API 設定</h3>
                <button class="close-btn" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <label>CWA API 授權碼</label>
                <input type="text" id="apiKeyInput" placeholder="請輸入您的 API Key">
                <p class="hint">請至 <a href="https://opendata.cwa.gov.tw" target="_blank">中央氣象署開放資料平台</a> 申請</p>
            </div>
            <div class="modal-foot">
                <button class="btn ghost" id="modalCancel">取消</button>
                <button class="btn primary" id="modalSave">儲存</button>
            </div>
        </div>
    </div>

    <!-- 圖片燈箱 -->
    <div class="lightbox" id="imageModal">
        <button class="lightbox-close" id="imageModalClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <img src="" alt="地震報告圖" id="modalImage">
    </div>

    <!-- 衛星雲圖燈箱 -->
    <div class="lightbox" id="satelliteModal">
        <button class="lightbox-close" id="satelliteModalClose">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="18" y1="6" x2="6" y2="18" />
                <line x1="6" y1="6" x2="18" y2="18" />
            </svg>
        </button>
        <img src="https://www.cwa.gov.tw/Data/satellite/LCC_IR1_CR_2750/LCC_IR1_CR_2750.jpg" alt="東亞衛星雲圖"
            id="satelliteImage">
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <!-- Loading -->
    <div class="loading hidden" id="loadingOverlay">
        <div class="spinner"></div>
        <p>載入中</p>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <!-- Scripts -->
    <script src="townships.js"></script>
    <script src="app.js"></script>
</body>

</html>
